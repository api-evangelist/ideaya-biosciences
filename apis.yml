name: Ideaya Biosciences
description: >-
  IDEAYA Biosciences is a clinical-stage precision medicine oncology company headquartered
  in South San Francisco, California (NASDAQ IDYA), focused on discovering, developing, and commercializing
  targeted therapeutics for genetically defined cancer patient populations. Its research spans PKC
  inhibition in uveal melanoma, antibody-drug conjugate and DNA-damage-response combinations, synthetic-lethal
  MTAP-pathway programs, and KAT6/7 epigenetic inhibition, led by the investigational candidate darovasertib
  in registrational uveal melanoma trials. The company maintains a corporate and investor-relations web
  presence and does not currently publish a public developer API.
